<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports - Riverbend Council Facilities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="sitenav"></div>
      <main class="main">
        <div class="container">
          <h1>Reports</h1>
          <p class="subtitle">Facility utilisation and audit history.</p>

          <!-- The charts are deliberately lightweight: the browser only needs the counts. -->
          <h2>Bookings per Resource</h2>
          <div id="bookingschart" class="barchart"></div>

          <h2>Maintenance Tasks per Resource</h2>
          <div id="maintenancechart" class="barchart"></div>

          <h2>Audit History</h2>
          <div class="formrow">
            <div>
              <label for="auditsearch">Search audit log</label>
              <input type="text" id="auditsearch" placeholder="Search by actor, action, or details" />
            </div>
          </div>
          <div class="tablewrap">
            <table id="audittable">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="auditbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="nav.js"></script>
    <script src="reports.js"></script>
  </body>
</html>
